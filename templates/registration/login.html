{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <button type="submit" class="button">Log in</button>
  </form>
  <p>No household yet? <a href="{% url 'signup' %}">Create one</a>.</p>
{% endblock %}
